<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Footer wave">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f3d4c"/>
      <stop offset="0.5" stop-color="#111c3a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <g>
    <path fill="url(#w)" fill-opacity="0.45" d="M0 60 Q150 20 300 60 T600 60 T900 60 T1200 60 T1500 60 T1800 60 T2100 60 T2400 60 V120 H0 Z">
