<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 304" width="1200" height="304" role="img" aria-labelledby="t d">
  <title id="t">Tech stack</title>
  <desc id="d">Languages: Java, Python, JavaScript, C. Frontend: HTML, CSS, React, Vite. Backend and data: Node.js, FastAPI, Fastify, MySQL, PostgreSQL. Tooling: Git, GitHub, VS Code, IntelliJ IDEA, Linux, Maven.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111c3a"/>
    </linearGradient>
    <style>
      .label { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2.5px; fill: #7dd3fc; }
      .pill rect { fill: #ffffff; fill-opacity: 0.05; stroke: #ffffff; stroke-opacity: 0.12; }
      .pill text { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .pill { animation: pop 0.6s ease-out both; }
      .r1 { animation-delay: 0.1s; } .r2 { animation-delay: 0.3s; } .r3 { animation-delay: 0.5s; } .r4 { animation-delay: 0.7s; }
      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect width="1200" height="304" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="303" rx="18" fill="none" stroke="#7dd3fc" stroke-opacity="0.14"/>
  <path d="M48 88H1152M48 152H1152M48 216H1152" stroke="#ffffff" stroke-opacity="0.06"/>

